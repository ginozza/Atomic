name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK & NDK
        run: |
          ANDROID_SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$ANDROID_SDK" ] || [ ! -d "$ANDROID_SDK" ]; then
            ANDROID_SDK="/usr/local/lib/android/sdk"
          fi
          echo "ANDROID_HOME=$ANDROID_SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK" >> $GITHUB_ENV
          echo "$ANDROID_SDK/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK/platform-tools" >> $GITHUB_PATH

          # Accept SDK licenses
          yes | "$ANDROID_SDK/cmdline-tools/latest/bin/sdkmanager" --licenses || true

          # Find or install NDK
          NDK_DIR=""
          if [ -d "$ANDROID_SDK/ndk" ] && [ "$(ls -A $ANDROID_SDK/ndk 2>/dev/null)" ]; then
            NDK_DIR=$(ls -d $ANDROID_SDK/ndk/* | sort -V | tail -n 1)
            echo "Preinstalled NDK found at: $NDK_DIR"
          else
            echo "Installing Android NDK via sdkmanager..."
            yes | "$ANDROID_SDK/cmdline-tools/latest/bin/sdkmanager" "ndk;27.1.12297006" || true
            NDK_DIR=$(ls -d $ANDROID_SDK/ndk/* | sort -V | tail -n 1)
          fi
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "Using Android SDK: $ANDROID_SDK"
          echo "Using Android NDK: $NDK_DIR"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/player/src-tauri

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        run: |
          npm install -g pnpm@12.0.0 || npm install -g pnpm
          pnpm --version

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build frontend
        run: pnpm --filter @nuclearplayer/player build:frontend
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Build Android APK (debug)
        run: pnpm --filter @nuclearplayer/player tauri android build --target aarch64 --debug --apk
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          NDK_HOME: ${{ env.NDK_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Locate and Rename APK
        run: |
          APK_PATH=$(find packages/player/src-tauri/gen/android/app/build/outputs/apk -name "*debug.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find packages/player/src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          if [ -z "$APK_PATH" ]; then
            echo "Error: No APK file found in outputs/apk!"
            exit 1
          fi
          echo "Discovered APK at: $APK_PATH"

          VERSION=$(node -p "require('./packages/player/package.json').version")
          SHORT_SHA="${GITHUB_SHA::7}"
          DEST_NAME="Atomic-v${VERSION}-${SHORT_SHA}-debug.apk"

          cp "$APK_PATH" "$DEST_NAME"
          echo "APK_NAME=$DEST_NAME" >> $GITHUB_ENV
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV
          echo "Prepared APK asset: $DEST_NAME"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}-{1}', env.APP_VERSION, env.SHORT_SHA) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('Atomic {0}', github.ref_name) || format('Atomic v{0} ({1})', env.APP_VERSION, env.SHORT_SHA) }}
          files: ${{ env.APK_NAME }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
